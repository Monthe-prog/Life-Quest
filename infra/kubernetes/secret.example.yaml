apiVersion: v1
kind: Secret
metadata:
  name: operator-secrets
  namespace: operator
type: Opaque
stringData:
  POSTGRES_USER: operator
  POSTGRES_PASSWORD: change-me-before-apply
  POSTGRES_DB: operator
  DATABASE_URL: postgresql+asyncpg://operator:change-me-before-apply@postgres:5432/operator
  JWT_SECRET_KEY: change-me-to-a-long-random-secret
  OPENAI_API_KEY: ""
