apiVersion: v1
kind: Service
metadata:
  name: oracle-service
  namespace: operator
spec:
  selector:
    app: oracle-service
  ports:
    - name: http
      port: 8010
      targetPort: 8010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-service
  namespace: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-service
  template:
    metadata:
      labels:
        app: oracle-service
    spec:
      containers:
        - name: oracle-service
          image: life-quest-backend:latest
          imagePullPolicy: Never
          command:
            - uvicorn
            - app.modules.oracle.service_app:app
            - --host
            - 0.0.0.0
            - --port
            - "8010"
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: operator-config
            - secretRef:
                name: operator-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 30
