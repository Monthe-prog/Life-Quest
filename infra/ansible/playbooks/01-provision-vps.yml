---
- name: Provision OPERATOR VPS packages and services
  hosts: lifequest
  become: true
  vars:
    system_packages:
      - ca-certificates
      - chrony
      - curl
      - fail2ban
      - git
      - gnupg
      - nginx
      - python3
      - tmux
      - ufw
      - unzip
    firewall_ports:
      - "22/tcp"
      - "80/tcp"
      - "443/tcp"
      - "3000/tcp"
      - "8000/tcp"
      - "8080/tcp"
      - "9090/tcp"
      - "3001/tcp"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: present

    - name: Ensure Docker apt key directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true

    - name: Enable and start core services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - nginx
        - chrony
        - fail2ban

    - name: Allow required firewall ports
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}"
      loop: "{{ firewall_ports }}"
      changed_when: true

    - name: Enable firewall
      ansible.builtin.command:
        cmd: ufw --force enable
      changed_when: true
